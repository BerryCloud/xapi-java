# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven on Push

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: |
            pom.xml
            xapi-model/pom.xml
            xapi-client/pom.xml
            xapi-model-spring-boot-starter/pom.xml
      - name: Test Sonar exporter and collect Python coverage
        run: |
          python3 -m venv "$RUNNER_TEMP/sonar-export-tests"
          "$RUNNER_TEMP/sonar-export-tests/bin/pip" install coverage==7.10.7
          "$RUNNER_TEMP/sonar-export-tests/bin/coverage" run --source=.github/scripts --omit="*/test_*" -m unittest discover -s .github/scripts -p "test_export_sonar_findings.py"
          mkdir -p target
          "$RUNNER_TEMP/sonar-export-tests/bin/coverage" xml -o target/python-coverage.xml
      - name: Test release helper scripts
        run: bash .github/scripts/test-update-example-versions.sh
      - name: Build with Maven
        run: ./mvnw -B verify
      - name: Scan with Sonar
        run: ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=BerryCloud_xapi-java -Dsonar.organization=berrycloud -Dsonar.python.coverage.reportPaths=target/python-coverage.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
