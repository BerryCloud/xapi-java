# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven on Pull Request

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: |
            pom.xml
            xapi-model/pom.xml
            xapi-client/pom.xml
            xapi-model-spring-boot-starter/pom.xml
      - name: Test Sonar exporter and collect Python coverage
        run: |
          python3 -m venv "$RUNNER_TEMP/sonar-export-tests"
          "$RUNNER_TEMP/sonar-export-tests/bin/pip" install coverage==7.10.7
          "$RUNNER_TEMP/sonar-export-tests/bin/coverage" run --source=.github/scripts --omit="*/test_*" -m unittest discover -s .github/scripts -p "test_export_sonar_findings.py"
          mkdir -p target
          "$RUNNER_TEMP/sonar-export-tests/bin/coverage" xml -o target/python-coverage.xml
      - name: Test release helper scripts
        run: bash .github/scripts/test-update-example-versions.sh
      - name: Build with Maven
        run: ./mvnw -B install
      - name: Check documentation
        run: ./mvnw -B javadoc:javadoc -pl xapi-model,xapi-client,xapi-model-spring-boot-starter -am # This checks that the Javadoc is valid
      - name: Scan with Sonar
        run: |
          if [ $FORK = false ] && [ "$ACTOR" != "dependabot[bot]" ]
          then
            ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=BerryCloud_xapi-java -Dsonar.organization=berrycloud -Dsonar.python.coverage.reportPaths=target/python-coverage.xml
          fi
        env:
          FORK: ${{ github.event.pull_request.head.repo.fork }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
